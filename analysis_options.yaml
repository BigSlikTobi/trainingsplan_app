# Static analysis configuration for the T4L Trainer app.
#
# Builds on the recommended Flutter lints with a curated set of higher-signal
# rules that catch real defects (leaked subscriptions, fire-and-forget futures,
# context use across async gaps) and keep the codebase consistent. See
# https://dart.dev/lints for the full catalogue.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Treat leaked resources and unsafe async as errors, not warnings — these
    # are the failure modes the audit flagged in the controller.
    cancel_subscriptions: error
    close_sinks: error
    use_build_context_synchronously: error

linter:
  rules:
    # Resource & async safety
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - avoid_slow_async_io

    # Correctness
    - avoid_dynamic_calls
    - no_adjacent_strings_in_list
    - throw_in_finally
    - unnecessary_statements

    # Consistency & readability
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - use_super_parameters
    - unnecessary_parenthesis
    - avoid_redundant_argument_values
    - sized_box_for_whitespace
    - avoid_unnecessary_containers
